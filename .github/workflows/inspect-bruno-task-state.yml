name: Inspect Bruno task grading state

on:
  push:
    paths:
      - ".github/workflows/inspect-bruno-task-state.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read sanitized Bruno grading state
        shell: bash
        run: |
          node <<'NODE'
          const base = "https://youteach-d9a79-default-rtdb.firebaseio.com";
          async function read(path) {
            const r = await fetch(`${base}/${path}.json`);
            if (!r.ok) throw new Error(`${path}: ${r.status} ${await r.text()}`);
            return await r.json();
          }

          const [students, groups, assignments, submissions, settings] = await Promise.all([
            read("students"),
            read("groups"),
            read("assignments"),
            read("assignmentSubmissions"),
            read("settings")
          ]);

          const match = Object.entries(students || {}).find(([, student]) =>
            String(student?.fullName || student?.name || "").toLowerCase().includes("bruno") &&
            String(student?.fullName || student?.name || "").toLowerCase().includes("ledesma")
          );

          if (!match) throw new Error("Bruno Ledesma not found.");
          const [studentKey, student] = match;

          console.log("=== BRUNO ===");
          console.log(JSON.stringify({
            studentKey,
            fullName: student?.fullName || student?.name || null,
            groupName: student?.groupName || null,
            groupMemberships: Object.keys(student?.groupMemberships || {}).filter(k => student.groupMemberships[k] === true),
            taskPoints: student?.taskPoints || null,
            blockPoints: student?.blockPoints || null,
            attendancePoints: student?.attendancePoints || null,
            examPoints: student?.examPoints || null
          }));

          console.log("=== SETTINGS ===");
          console.log(JSON.stringify({activeBlock: settings?.activeBlock || null}));

          console.log("=== FANTASMA CONFIG ===");
          const g = groups?.FANTASMA || null;
          console.log(JSON.stringify(g ? {
            name: g.name || null,
            evaluationUnitCount: g.evaluationUnitCount ?? null,
            evaluationCriteria: g.evaluationCriteria || null,
            assignmentCriterionDefaults: g.assignmentCriterionDefaults || null
          } : null));

          console.log("=== ASSIGNMENTS + BRUNO SUBMISSIONS ===");
          for (const [assignmentId, assignment] of Object.entries(assignments || {})) {
            const submission = submissions?.[assignmentId]?.[studentKey] || null;
            if (String(assignment?.groupName || "").toUpperCase() !== "FANTASMA" && !submission) continue;
            console.log(JSON.stringify({
              assignmentId,
              code: assignment?.code || null,
              title: assignment?.title || null,
              groupName: assignment?.groupName || null,
              assignmentTypeCode: assignment?.assignmentTypeCode || null,
              evaluationBlock: assignment?.evaluationBlock || assignment?.block || null,
              criterionId: assignment?.evaluationTarget?.criterionId || assignment?.groupEvaluationCriterionId || null,
              criterionName: assignment?.evaluationTarget?.criterionNameSnapshot || assignment?.groupEvaluationCriterionName || null,
              target: assignment?.evaluationTarget || null,
              submission: submission ? {
                gradePublished: submission.gradePublished ?? null,
                gradingTotalScore: submission?.grading?.totalScore ?? null,
                grading: submission.grading || null,
                manualGrading: submission.manualGrading || null,
                aiGrading: submission.aiGrading || null,
                driveFileId: Boolean(submission.driveFileId)
              } : null
            }));
          }
          NODE
