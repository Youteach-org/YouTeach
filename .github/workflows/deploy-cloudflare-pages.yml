name: Deploy YouTeach to Cloudflare Pages

on:
  push:
    branches:
      - main
      - live-cog-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run YouTeach regression tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee test-output.txt

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Build Pages output
        run: sh build-pages.sh

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=youteach --branch="${GITHUB_REF_NAME}" --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inspect Cloudflare Pages production state
        shell: bash
        run: |
          echo "PROJECTS"
          npx wrangler@4 pages project list --json
          echo "PRODUCTION DEPLOYMENTS"
          npx wrangler@4 pages deployment list --project-name=youteach --environment=production --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
