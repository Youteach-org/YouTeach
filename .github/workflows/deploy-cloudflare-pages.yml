name: Verify and deploy YouTeach

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run YouTeach regression tests
        run: node --test tests/*.test.mjs

      - name: Build Pages output
        run: sh build-pages.sh

      - name: Configure isolated preview bindings
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PREVIEW_SESSION_SECRET="$(openssl rand -hex 32)"
          printf '%s' "$PREVIEW_SESSION_SECRET" | \
            npx wrangler@4 pages secret put YOUTEACH_SESSION_SECRET \
              --project-name=youteach --env preview
          printf '%s' 'https://feature-youteach-cog-assignm.classroom-online-games.pages.dev' | \
            npx wrangler@4 pages secret put COG_ASSIGNMENT_ORIGIN \
              --project-name=youteach --env preview

      - name: Deploy YouTeach preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name=youteach \
            --branch="${{ github.head_ref }}" \
            --commit-hash="${{ github.event.pull_request.head.sha }}"

      - name: Smoke test YouTeach preview
        if: github.event_name == 'pull_request'
        run: |
          PREVIEW='https://feature-cog-youteach-assignm.youteach.pages.dev'
          COG_PREVIEW='https://feature-youteach-cog-assignm.classroom-online-games.pages.dev'

          echo "Checking student assignment assets..."
          curl -fsS --retry 5 --retry-delay 2 "$PREVIEW/student-assignments.html" -o /tmp/student-assignments.html
          grep -q 'cog-assignment-box' /tmp/student-assignments.html || {
            echo "::error::COG assignment card CSS was not found in deployed student-assignments.html"
            exit 1
          }

          curl -fsS --retry 5 --retry-delay 2 "$PREVIEW/student-assignments.js" -o /tmp/student-assignments.js
          grep -q '/api/cog-assignment-launch' /tmp/student-assignments.js || {
            echo "::error::Deployed student-assignments.js does not call the COG assignment launch endpoint"
            exit 1
          }
          grep -q 'Authorization' /tmp/student-assignments.js || {
            echo "::error::Deployed student-assignments.js does not send signed-session authorization"
            exit 1
          }

          echo "Checking unauthenticated assignment launch rejection..."
          STATUS="$(curl -sS -o /tmp/launch-no-auth.json -w '%{http_code}' \
            -X POST "$PREVIEW/api/cog-assignment-launch" \
            -H 'Content-Type: application/json' \
            --data '{"assignmentId":"smoke-test"}')"
          echo "Launch endpoint status: $STATUS"
          cat /tmp/launch-no-auth.json
          test "$STATUS" = '401' || {
            echo "::error::Expected 401 from unauthenticated COG assignment launch, got $STATUS"
            exit 1
          }
          grep -q 'Sign in again' /tmp/launch-no-auth.json || {
            echo "::error::Unauthenticated launch response did not contain the expected sign-in message"
            exit 1
          }

          echo "Checking preview-to-preview CORS..."
          STATUS="$(curl -sS -D /tmp/cors-headers.txt -o /dev/null -w '%{http_code}' \
            -X OPTIONS "$PREVIEW/api/cog-launch-resolve" \
            -H "Origin: $COG_PREVIEW" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: Content-Type')"
          echo "CORS preflight status: $STATUS"
          cat /tmp/cors-headers.txt
          test "$STATUS" = '204' || {
            echo "::error::Expected 204 from COG launch resolver preflight, got $STATUS"
            exit 1
          }
          tr -d '\r' < /tmp/cors-headers.txt | grep -Fqi "access-control-allow-origin: $COG_PREVIEW" || {
            echo "::error::COG preview origin was not returned in Access-Control-Allow-Origin"
            exit 1
          }

      - name: Ensure YouTeach student session secret exists
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler@4 pages secret list --project-name=youteach 2>/dev/null | grep -q 'YOUTEACH_SESSION_SECRET'; then
            SESSION_SECRET="$(openssl rand -hex 32)"
            printf '%s' "$SESSION_SECRET" | npx wrangler@4 pages secret put YOUTEACH_SESSION_SECRET --project-name=youteach
          else
            echo "YOUTEACH_SESSION_SECRET already configured; keeping existing value."
          fi

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler@4 pages deploy dist --project-name=youteach --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
