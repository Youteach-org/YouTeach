name: Deploy YouTeach to Cloudflare Pages

on:
  push:
    branches:
      - main
      - feature/live-cog-session-current-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run YouTeach regression tests
        run: node --test tests/*.test.mjs

      - name: Build Pages output
        run: sh build-pages.sh

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=youteach --branch="${GITHUB_REF_NAME}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
