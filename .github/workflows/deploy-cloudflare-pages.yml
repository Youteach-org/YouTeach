name: Verify and deploy YouTeach

on:
  push:
    branches:
      - main
      - feature/cog-official-results-20260919
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run YouTeach regression tests
        run: node --test tests/*.test.mjs

      - name: Build Pages output
        run: sh build-pages.sh

      - name: Configure isolated preview bindings
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PREVIEW_SESSION_SECRET="$(openssl rand -hex 32)"
          printf '%s' "$PREVIEW_SESSION_SECRET" | \
            npx wrangler@4 pages secret put YOUTEACH_SESSION_SECRET \
              --project-name=youteach --env preview
          printf '%s' 'https://cog-youteach-secure-current.classroom-online-games.pages.dev' | \
            npx wrangler@4 pages secret put COG_ASSIGNMENT_ORIGIN \
              --project-name=youteach --env preview

      - name: Deploy YouTeach preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name=youteach \
            --branch="cog-secure-current" \
            --commit-hash="${{ github.sha }}"

      - name: Smoke test YouTeach preview
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          PREVIEW='https://cog-secure-current.youteach.pages.dev'
          COG_PREVIEW='https://cog-youteach-secure-current.classroom-online-games.pages.dev'

          fetch_preview() {
            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "$@"
          }

          fetch_preview "$PREVIEW/student-assignments.html" -o /tmp/student-assignments.html
          test -s /tmp/student-assignments.html || {
            echo "::error::student-assignments.html did not deploy"
            exit 1
          }

          fetch_preview "$PREVIEW/student-assignments.js" -o /tmp/student-assignments.js
          grep -q '/api/cog-assignment-launch' /tmp/student-assignments.js || {
            echo "::error::student-assignments.js is missing the COG launch endpoint"
            exit 1
          }
          grep -q 'Authorization' /tmp/student-assignments.js || {
            echo "::error::student-assignments.js is missing signed-session authorization"
            exit 1
          }

          STATUS="$(curl -sS --retry 10 --retry-delay 2 --retry-all-errors -o /tmp/launch-no-auth.json -w '%{http_code}' \
            -X POST "$PREVIEW/api/cog-assignment-launch" \
            -H 'Content-Type: application/json' \
            --data '{"assignmentId":"smoke-test"}')"
          echo "Unauthenticated launch status: $STATUS"
          cat /tmp/launch-no-auth.json
          test "$STATUS" = '401'
          grep -q 'Sign in again' /tmp/launch-no-auth.json

          STATUS="$(curl -sS --retry 10 --retry-delay 2 --retry-all-errors -D /tmp/cors-headers.txt -o /dev/null -w '%{http_code}' \
            -X OPTIONS "$PREVIEW/api/cog-launch-resolve" \
            -H "Origin: $COG_PREVIEW" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: Content-Type')"
          echo "Resolver preflight status: $STATUS"
          cat /tmp/cors-headers.txt
          test "$STATUS" = '204'
          grep -qi "access-control-allow-origin: $COG_PREVIEW" /tmp/cors-headers.txt

      - name: Ensure YouTeach student session secret exists
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler@4 pages secret list --project-name=youteach 2>/dev/null | grep -q 'YOUTEACH_SESSION_SECRET'; then
            SESSION_SECRET="$(openssl rand -hex 32)"
            printf '%s' "$SESSION_SECRET" | npx wrangler@4 pages secret put YOUTEACH_SESSION_SECRET --project-name=youteach
          else
            echo "YOUTEACH_SESSION_SECRET already configured; keeping existing value."
          fi

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler@4 pages deploy dist --project-name=youteach --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}