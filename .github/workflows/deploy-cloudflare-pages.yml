name: Deploy YouTeach to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run YouTeach regression tests
        run: node --test tests/*.test.mjs

      - name: Build Pages output
        run: sh build-pages.sh

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=youteach --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: TEMP diagnose AI grading sync for PJ-CIRMAY-FAN-151026
        run: |
          sleep 5
          echo "Calling production AI sync endpoint..."
          curl --fail-with-body -sS \
            -X POST "https://youteach.pages.dev/api/sync-ai-grades" \
            -H "Content-Type: application/json" \
            --data '{"assignmentId":"-P1cfon183isjeJE5D8r","forceRegrade":true}'
          echo
