name: Live COG preview E2E

on:
  push:
    branches:
      - feature/live-cog-firebase-current-20260921
    paths:
      - tests/live-cog-preview-e2e.mjs
      - .github/workflows/live-cog-preview-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YT_PREVIEW: https://feature-live-cog-firebase-cu.youteach.pages.dev
      COG_PREVIEW: https://feature-live-cog-firebase-cu.classroom-online-games.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run live COG preview smoke
        run: node tests/live-cog-preview-e2e.mjs
