name: Live COG preview E2E

on:
  push:
    branches:
      - live-cog-20260922
    paths:
      - tests/live-cog-preview-e2e.mjs
      - .github/workflows/live-cog-preview-e2e.yml
      - teacher-assignments.js
      - teacher-assignments.html
      - assignment-create-module.js
      - student-buzzer.js
      - student-buzzer.html
      - cog-live-session-policy.mjs
      - cog-assignment-results.mjs
      - build-pages.sh
      - functions/api/cog-live-*.js
      - functions/_shared/cog-live-*.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YT_PREVIEW: https://live-cog-20260922.youteach.pages.dev
      COG_PREVIEW: https://live-cog-20260922.classroom-online-games.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run live COG preview smoke
        run: node tests/live-cog-preview-e2e.mjs
