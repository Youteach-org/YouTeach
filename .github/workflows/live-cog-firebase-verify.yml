name: Verify Firebase live COG branch

on:
  push:
    branches:
      - feature/live-cog-firebase-current-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check server JavaScript
        run: |
          if [ -d functions ]; then
            find functions -name '*.js' -print0 | xargs -0 -r -n1 node --check
          fi

      - name: Check critical client JavaScript
        run: |
          node --check student-buzzer.js
          node --check assignment-create-module.js

      - name: Run YouTeach tests
        run: node --test tests/*.test.mjs

      - name: Build Pages output
        run: sh build-pages.sh
