name: Talk Talk V1 CI

on:
  push:
    branches:
      - feature/talk-talk-v1-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check YouTeach function syntax
        run: find functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run Live COG and Talk Talk tests
        run: node --test tests/cog-live-*.test.mjs tests/talk-talk-*.test.mjs
      - name: Build Cloudflare Pages bundle
        run: sh build-pages.sh

  deploy-preview:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build YouTeach preview site
        run: sh build-pages.sh
      - name: Deploy isolated Talk Talk preview
        run: npx wrangler@4 pages deploy dist --project-name=youteach --branch=talk-talk-v1-20260921 --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  verify-preview:
    needs: deploy-preview
    runs-on: ubuntu-latest
    steps:
      - name: Probe YouTeach preview and Live COG functions
        run: |
          set -eu
          BASE="https://talk-talk-v1-20260921.youteach.pages.dev"
          curl -fsS --retry 8 --retry-delay 3 "$BASE/" -o /tmp/youteach.html
          curl -fsS --retry 8 --retry-delay 3 "$BASE/assignment-create-module.js" -o /tmp/assignment.js
          grep -Fq '<title>YouTeach</title>' /tmp/youteach.html
          grep -Fq '/api/cog-live-teacher-launch' /tmp/assignment.js
          TEACHER_STATUS="$(curl -sS -o /tmp/teacher-api.json -w '%{http_code}' -X POST "$BASE/api/cog-live-teacher-launch" -H 'Content-Type: application/json' --data '{"assignmentId":"smoke"}')"
          STUDENT_STATUS="$(curl -sS -o /tmp/student-api.json -w '%{http_code}' -X POST "$BASE/api/cog-live-student-launch")"
          test "$TEACHER_STATUS" = "401"
          test "$STUDENT_STATUS" = "401"
          grep -Fq 'Sign in again' /tmp/teacher-api.json
          grep -Fq 'Sign in again' /tmp/student-api.json

          LOGIN_STATUS="$(curl -sS -o /tmp/teacher-login-api.json -w '%{http_code}' -X POST "$BASE/api/teacher-session" -H 'Content-Type: application/json' --data '{"username":"__preview_probe__","password":"__invalid__"}')"
          echo "teacher-session preview status=$LOGIN_STATUS"
          cat /tmp/teacher-login-api.json
          test "$LOGIN_STATUS" = "403"
          grep -Fq 'Invalid username or password.' /tmp/teacher-login-api.json
      - name: Browser-load YouTeach landing shell
        run: |
          set -eu
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" || (echo "::error::No Chrome browser on runner" && exit 1)
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom             https://talk-talk-v1-20260921.youteach.pages.dev/ > /tmp/youteach-dom.html
          grep -Fq 'Choose your access point' /tmp/youteach-dom.html

  diagnose-preview-bindings:
    needs: deploy-preview
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cloudflare Pages binding names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          test -n "$ACCOUNT_ID"
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/youteach"             -o /tmp/project.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/project.json'))
          result=data.get('result') or {}
          configs=result.get('deployment_configs') or {}
          for env_name in ('production','preview'):
              env=configs.get(env_name) or {}
              kv=env.get('kv_namespaces') or {}
              env_vars=env.get('env_vars') or {}
              print(env_name, 'kv_bindings=', sorted(kv.keys()))
              print(env_name, 'env_var_names=', sorted(env_vars.keys()))
              for name, item in sorted(env_vars.items()):
                  kind=(item or {}).get('type')
                  print(env_name, 'env_var', name, 'type=', kind)
          PY
