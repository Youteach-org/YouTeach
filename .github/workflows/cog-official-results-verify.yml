name: Verify COG official results

on:
  push:
    branches:
      - feature/cog-official-results-20260919
      - feature/cog-youteach-secure-integrated-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check server modules
        run: |
          find functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run YouTeach tests
        run: node --test tests/*.test.mjs