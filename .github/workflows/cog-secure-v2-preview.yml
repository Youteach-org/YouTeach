name: Verify secure COG auth preview

on:
  push:
    branches:
      - feature/cog-youteach-secure-current-20260920-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check server modules
        run: find functions -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run YouTeach regression tests
        run: node --test tests/*.test.mjs

      - name: Build Pages output
        run: sh build-pages.sh

      - name: Configure isolated preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREVIEW_SESSION_SECRET="$(openssl rand -hex 32)"
          printf '%s' "$PREVIEW_SESSION_SECRET" |             npx wrangler@4 pages secret put YOUTEACH_SESSION_SECRET               --project-name=youteach --env preview
          printf '%s' 'https://cog-secure-current-v2.classroom-online-games.pages.dev' |             npx wrangler@4 pages secret put COG_ASSIGNMENT_ORIGIN               --project-name=youteach --env preview

      - name: Deploy isolated YouTeach preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy dist             --project-name=youteach             --branch=cog-secure-current-v2             --commit-hash="${{ github.sha }}"

      - name: Smoke test YouTeach preview
        run: |
          set -euo pipefail
          PREVIEW='https://cog-secure-current-v2.youteach.pages.dev'
          COG_PREVIEW='https://cog-secure-current-v2.classroom-online-games.pages.dev'

          fetch_preview() {
            curl -fsSL --retry 10 --retry-delay 2 --retry-all-errors "$@"
          }

          fetch_preview "$PREVIEW/assignment-create-module.html" -o /tmp/assignment-create.html
          fetch_preview "$PREVIEW/student-assignments.js" -o /tmp/student-assignments.js

          grep -q 'cogActivityConfigPanel' /tmp/assignment-create.html
          grep -q '/api/cog-assignment-launch' /tmp/student-assignments.js
          grep -q 'Authorization' /tmp/student-assignments.js
          grep -q '/api/cog-result-undo' /tmp/student-assignments.js

          STATUS="$(curl -sS --retry 10 --retry-delay 2 --retry-all-errors             -o /tmp/launch-no-auth.json -w '%{http_code}'             -X POST "$PREVIEW/api/cog-assignment-launch"             -H 'Content-Type: application/json'             --data '{"assignmentId":"smoke-test"}')"
          test "$STATUS" = '401'
          grep -q 'Sign in again' /tmp/launch-no-auth.json

          STATUS="$(curl -sS --retry 10 --retry-delay 2 --retry-all-errors             -D /tmp/cors-headers.txt -o /dev/null -w '%{http_code}'             -X OPTIONS "$PREVIEW/api/cog-launch-resolve"             -H "Origin: $COG_PREVIEW"             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: Content-Type')"
          test "$STATUS" = '204'
          grep -qi "access-control-allow-origin: $COG_PREVIEW" /tmp/cors-headers.txt
