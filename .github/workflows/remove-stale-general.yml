name: Remove stale GENERAL group

on:
  push:
    paths:
      - ".github/workflows/remove-stale-general.yml"

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and remove unused GENERAL
        shell: bash
        run: |
          node <<'NODE'
          const base = "https://youteach-d9a79-default-rtdb.firebaseio.com";

          async function read(path) {
            const r = await fetch(`${base}/${path}.json`);
            if (!r.ok) throw new Error(`Read ${path} failed: ${r.status} ${await r.text()}`);
            return await r.json();
          }

          const [general, students] = await Promise.all([
            read("groups/GENERAL"),
            read("students")
          ]);

          if (!general) {
            console.log("GENERAL already absent.");
            process.exit(0);
          }

          const rows = Object.values(students || {});
          const refs = rows.filter(student =>
            String(student?.groupName || "").trim().toUpperCase() === "GENERAL" ||
            student?.groupMemberships?.GENERAL === true
          );

          console.log(JSON.stringify({
            generalKeys: Object.keys(general || {}).sort(),
            studentReferences: refs.length
          }));

          if (refs.length) {
            throw new Error(`Refusing to delete GENERAL: ${refs.length} student reference(s) remain.`);
          }

          const del = await fetch(`${base}/groups/GENERAL.json`, { method: "DELETE" });
          if (!del.ok) throw new Error(`DELETE failed: ${del.status} ${await del.text()}`);

          const after = await read("groups/GENERAL");
          if (after !== null) throw new Error("GENERAL still exists after DELETE.");

          console.log("VERIFIED: GENERAL removed and remains null.");
          NODE
