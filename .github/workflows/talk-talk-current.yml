name: Talk Talk current YouTeach CI

on:
  push:
    branches:
      - feature/talk-talk-main-current-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check functions
        run: find functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run Talk Talk current tests
        run: node --test tests/talk-talk-current-ui.test.mjs tests/talk-talk-current-live.test.mjs
      - name: Live COG contract
        run: node --test tests/cog-live-contract.test.mjs
      - name: Live COG Firebase bridge
        run: node --test tests/cog-live-firebase-bridge.test.mjs
      - name: Live COG Firebase lifecycle
        run: node --test tests/cog-live-firebase-lifecycle.test.mjs
      - name: Live COG Firebase UI
        run: node --test tests/cog-live-firebase-ui.test.mjs
      - name: Build Pages
        run: sh build-pages.sh
