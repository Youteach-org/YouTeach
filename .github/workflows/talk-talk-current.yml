name: Talk Talk current preview

on:
  push:
    branches:
      - feature/talk-talk-main-current-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Talk Talk and current Live COG tests
        run: |
          node --test tests/talk-talk-current-ui.test.mjs tests/talk-talk-current-live.test.mjs
          node --test tests/cog-live-*.test.mjs
      - name: Check function syntax
        run: find functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build Pages
        run: sh build-pages.sh
      - name: Deploy current YouTeach Talk Talk preview
        run: npx wrangler@4 pages deploy dist --project-name=youteach --branch=talk-talk-v1-20260921 --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify current Ghost Lab and Talk Talk launch
        run: |
          set -eu
          BASE="https://talk-talk-v1-20260921.youteach.pages.dev"
          for n in 1 2 3 4 5 6 7 8; do
            curl -fsS "$BASE/teacher-ghost-lab.html" -o /tmp/ghost.html || true
            curl -fsS "$BASE/buzzer.html" -o /tmp/buzzer.html || true
            curl -fsS "$BASE/buzzer.js" -o /tmp/buzzer.js || true
            curl -fsS "$BASE/teacher-login.js" -o /tmp/login.js || true
            if grep -Fq 'openAddStudentModalBtn' /tmp/ghost.html 2>/dev/null               && grep -Fq 'existingStudentTabBtn' /tmp/ghost.html 2>/dev/null               && grep -Fq 'launchTalkTalkBtn' /tmp/buzzer.html 2>/dev/null               && grep -Fq 'Launch Talk Talk' /tmp/buzzer.html 2>/dev/null               && grep -Fq 'cogGameId: "talk-talk"' /tmp/buzzer.js 2>/dev/null               && grep -Fq 'youteachTeacherAuth' /tmp/login.js 2>/dev/null; then
              exit 0
            fi
            sleep 4
          done
          echo "::error::Current YouTeach preview did not expose Ghost Lab + Launch Talk Talk"
          exit 1
