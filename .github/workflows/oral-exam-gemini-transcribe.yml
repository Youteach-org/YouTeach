name: Oral Exam Gemini Literal Transcription

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: Temporary authenticated URL for the original audio
        required: true
        type: string
      pair_slug:
        description: Output slug, e.g. paul-paulina
        required: true
        type: string
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - docs/oral-exam-run-request.json

permissions:
  contents: write
  issues: write

jobs:
  transcribe:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.event.issue.title, '[oral-transcribe]')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check google-genai

      - name: Resolve request
        id: request
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              source_url = event['inputs']['audio_url']
              pair_slug = event['inputs']['pair_slug']
          elif os.environ['GITHUB_EVENT_NAME'] == 'push':
              payload = json.load(open('docs/oral-exam-run-request.json', encoding='utf-8'))
              source_url = payload['source_url']
              pair_slug = payload['pair_slug']
          else:
              payload = json.loads(event['issue']['body'] or '{}')
              source_url = payload['source_url']
              pair_slug = payload['pair_slug']
          if not pair_slug.replace('-', '').isalnum():
              raise SystemExit('pair_slug must contain only letters, numbers, and hyphens')
          print(f"source_url={source_url}")
          print(f"pair_slug={pair_slug}")
          PY

      - name: Verify Gemini credential is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GOOGLE_API_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
              gh issue comment "${{ github.event.issue.number }}" --body "Gemini transcription could not start because this repository has neither GEMINI_API_KEY nor GOOGLE_API_KEY configured as an Actions secret. No alternate transcription engine was used."
            fi
            echo "Gemini API key secret is not configured." >&2
            exit 2
          fi

      - name: Download original audio
        env:
          SOURCE_URL: ${{ steps.request.outputs.source_url }}
        shell: bash
        run: |
          curl --fail --location --retry 2 --silent --show-error "$SOURCE_URL" -o /tmp/oral-exam.ogg
          test -s /tmp/oral-exam.ogg
          echo "Downloaded $(wc -c < /tmp/oral-exam.ogg) bytes"

      - name: Run Gemini verbatim transcription
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PAIR_SLUG: ${{ steps.request.outputs.pair_slug }}
        shell: bash
        run: |
          mkdir -p docs/oral-exam-transcripts
          python tools/oral-exam/gemini_transcribe.py /tmp/oral-exam.ogg \
            --pair-slug "$PAIR_SLUG" \
            --output-json "docs/oral-exam-transcripts/${PAIR_SLUG}-stage1.json" \
            --output-md "docs/oral-exam-transcripts/${PAIR_SLUG}-stage1.md"

      - name: Validate Stage 1 output
        env:
          PAIR_SLUG: ${{ steps.request.outputs.pair_slug }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('docs/oral-exam-transcripts') / f"{os.environ['PAIR_SLUG']}-stage1.json"
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['stage'] == 1
          assert data['model'] == 'gemini-3.5-transcribe'
          assert data['mode'] == 'verbatim'
          assert data['speaker_diarization'] is True
          assert data['word_timestamps'] is True
          assert data['words'], 'Gemini returned no word annotations'
          assert data['turns'], 'Gemini returned no speaker turns'
          print(f"Validated {len(data['words'])} words and {len(data['turns'])} turns")
          PY

      - name: Commit literal transcript
        env:
          PAIR_SLUG: ${{ steps.request.outputs.pair_slug }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/oral-exam-transcripts/${PAIR_SLUG}-stage1.json" "docs/oral-exam-transcripts/${PAIR_SLUG}-stage1.md"
          git commit -m "data: add ${PAIR_SLUG} Gemini verbatim transcript"
          git push

      - name: Report success
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Gemini 3.5 Transcribe completed Stage 1 in verbatim mode with speaker diarization and word timestamps. The literal transcript was committed under docs/oral-exam-transcripts/."
