name: Find YouTeach auth KV namespace

on:
  push:
    branches:
      - feature/live-cog-session-current-20260920
    paths:
      - .github/workflows/cloudflare-kv-list.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-kv:
    runs-on: ubuntu-latest
    steps:
      - name: List KV namespace ids and titles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$account_id/storage/kv/namespaces?per_page=100"             | jq '{success, namespaces: [.result[] | {id, title}]}'
