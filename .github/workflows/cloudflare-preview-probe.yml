name: Probe Cloudflare preview aliases

on:
  push:
    branches:
      - feature/live-cog-session-current-20260920
    paths:
      - .github/workflows/cloudflare-preview-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secret presence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:+SET}"
          echo "CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:+SET}"

      - name: Inspect Cloudflare branch and production responses
        shell: bash
        run: |
          set -u

          inspect() {
            local label="$1"
            local url="$2"
            local marker="$3"
            local body="/tmp/$(echo "$label" | tr ' /' '__').body"
            local headers="/tmp/$(echo "$label" | tr ' /' '__').headers"
            local meta
            meta="$(curl -L -sS --connect-timeout 15 --max-time 30 -D "$headers" -o "$body" -w 'STATUS=%{http_code} FINAL=%{url_effective} TYPE=%{content_type} BYTES=%{size_download}' "$url" || true)"
            echo "=== $label ==="
            echo "URL=$url"
            echo "$meta"
            grep -iE '^(server|cf-ray|x-robots-tag|location|content-type):' "$headers" | tail -n 8 || true
            if grep -Fq "$marker" "$body"; then
              echo "MARKER=present"
            else
              echo "MARKER=missing"
            fi
            echo "BODY_HEAD_BEGIN"
            head -c 320 "$body" | tr '\n' ' ' || true
            echo
            echo "BODY_HEAD_END"
          }

          inspect "YouTeach branch" "https://feature-live-cog-session-cur.youteach.pages.dev/buzzer.js" "cog-live-teacher-launch"
          inspect "YouTeach production" "https://youteach.pages.dev/buzzer.js" "cog-live-teacher-launch"
          inspect "COG branch" "https://feature-live-cog-session-cur.classroom-online-games.pages.dev/shared/youteach-live-bridge.mjs" "launchMode: \"live-buzzer\""
          inspect "COG atomic 9dbf1e3" "https://6f2ba994.classroom-online-games.pages.dev/shared/youteach-live-bridge.mjs" "launchMode: \"live-buzzer\""
          inspect "COG production" "https://classroom-online-games.pages.dev/shared/youteach-live-bridge.mjs" "launchMode: \"live-buzzer\""
