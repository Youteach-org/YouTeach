name: Probe Cloudflare preview aliases

on:
  push:
    branches:
      - feature/live-cog-session-current-20260920
    paths:
      - .github/workflows/cloudflare-preview-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live COG previews
        shell: bash
        run: |
          set -euo pipefail
          YT="https://feature-live-cog-session-cur.youteach.pages.dev"
          COG="https://feature-live-cog-session-cur.classroom-online-games.pages.dev"

          yt_body=/tmp/yt.json
          yt_type=/tmp/yt.type
          yt_status="$(curl -sS -X POST --connect-timeout 15 --max-time 30             -H 'Content-Type: application/json'             -o "$yt_body"             -w '%{http_code}'             "$YT/api/cog-live-teacher-launch")"
          echo "YouTeach teacher-launch status=$yt_status"
          test "$yt_status" = "401"
          grep -Fq '"ok":false' "$yt_body"
          grep -Fq 'Sign in again before opening Classroom Online Games.' "$yt_body"
          echo "YouTeach live endpoint: OK"

          cog_body=/tmp/cog-bridge.mjs
          cog_headers=/tmp/cog.headers
          cog_status="$(curl -sS -D "$cog_headers" --connect-timeout 15 --max-time 30             -o "$cog_body"             -w '%{http_code}'             "$COG/shared/youteach-live-bridge.mjs")"
          echo "COG shared bridge status=$cog_status"
          test "$cog_status" = "200"
          grep -qiE '^content-type: (application/javascript|text/javascript)' "$cog_headers"
          grep -Fq 'launchMode: "live-buzzer"' "$cog_body"
          grep -Fq 'export async function registerLiveGameSession' "$cog_body"
          echo "COG shared live bridge: OK"
