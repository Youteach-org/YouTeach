name: Inspect live YouTeach assignment state

on:
  push:
    paths:
      - ".github/workflows/inspect-live-youteach-state.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read sanitized Firebase state
        shell: bash
        run: |
          node <<'NODE'
          const base = "https://youteach-d9a79-default-rtdb.firebaseio.com";

          async function read(path) {
            const response = await fetch(`${base}/${path}.json`);
            const text = await response.text();
            let value;
            try { value = JSON.parse(text); } catch { value = text; }
            console.log(`HTTP ${path}: ${response.status}`);
            if (!response.ok) {
              console.log(JSON.stringify(value));
              return null;
            }
            return value || {};
          }

          const groups = await read("groups");
          const assignments = await read("assignments");
          const submissions = await read("assignmentSubmissions");
          const students = await read("students");

          if (groups) {
            console.log("=== GROUPS ===");
            for (const [key, group] of Object.entries(groups)) {
              console.log(JSON.stringify({
                key,
                name: group?.name ?? null,
                groupName: group?.groupName ?? null,
                deleted: group?.deleted === true,
                deletedAt: group?.deletedAt ?? null,
                hasEvaluation: Boolean(group?.evaluationCriteria),
                unitCount: group?.evaluationUnitCount ?? null,
                createdAt: group?.createdAt ?? null,
                updatedAt: group?.updatedAt ?? null,
                evaluationUpdatedAt: group?.evaluationUpdatedAt ?? null,
                studentListDisplayUpdatedAt: group?.studentListDisplayUpdatedAt ?? null,
                keys: Object.keys(group || {}).sort()
              }));
            }
          }

          if (students) {
            const rows = Object.values(students || {});
            const primaryGeneral = rows.filter(student =>
              String(student?.groupName || "").trim().toUpperCase() === "GENERAL"
            ).length;
            const memberGeneral = rows.filter(student =>
              student?.groupMemberships?.GENERAL === true
            ).length;
            console.log("=== GENERAL STUDENT REFERENCES ===");
            console.log(JSON.stringify({
              totalStudents: rows.length,
              primaryGeneral,
              memberGeneral
            }));
          }

          if (assignments) {
            console.log("=== ASSIGNMENTS ===");
            console.log(`COUNT ${Object.keys(assignments).length}`);
            for (const [id, assignment] of Object.entries(assignments)) {
              console.log(JSON.stringify({
                id,
                code: assignment?.code ?? null,
                title: assignment?.title ?? null,
                groupName: assignment?.groupName ?? null,
                active: assignment?.active ?? null,
                recovered: assignment?.recoveredFromSubmissionHistory === true,
                evaluationBlock: assignment?.evaluationBlock ?? assignment?.block ?? null,
                evaluationTargetGroup: assignment?.evaluationTarget?.groupName ?? null
              }));
            }
          }

          if (submissions) {
            console.log("=== SUBMISSIONS ===");
            console.log(`ASSIGNMENT_IDS ${Object.keys(submissions).length}`);
            for (const [assignmentId, rows] of Object.entries(submissions)) {
              const values = Object.values(rows || {});
              const groupsSeen = [...new Set(values.map(x => x?.groupName).filter(Boolean))];
              const codes = [...new Set(values.map(x => x?.assignmentCode).filter(Boolean))];
              const titles = [...new Set(values.map(x => x?.assignmentTitle).filter(Boolean))];
              console.log(JSON.stringify({
                assignmentId,
                count: values.length,
                groups: groupsSeen,
                codes,
                titles,
                withDriveFile: values.filter(x => x?.driveFileId).length
              }));
            }
          }
          NODE
