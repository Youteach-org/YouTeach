name: Verify auth hardening

on:
  push:
    branches:
      - feature/auth-hardening-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check server auth modules
        run: |
          find functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run YouTeach tests
        run: node --test tests/*.test.mjs
