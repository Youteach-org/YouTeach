<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Student Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="menuToggle" class="hamburger-btn" aria-label="Open menu" onclick="window.__toggleSidebar && window.__toggleSidebar(event)">
    <span></span><span></span><span></span>
  </button>

  <div class="menu-shell">
    <aside id="sidebar" class="sidebar collapsible-sidebar">
      <div class="brand">
        <h1>YouTeach</h1>
        <p>Student Menu</p>
      </div>

      <div class="sidebar-links">
        <a class="sidebar-link" href="student-buzzer.html">Buzzer</a>
        <a class="sidebar-link" href="student-summary.html">My Summary</a>
        <a class="sidebar-link active-link" href="student-settings.html">Settings</a>
        <a class="sidebar-link" href="index.html">Home</a>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h2>Settings</h2>
          <p>Change nickname and password</p>
        </div>
        <div class="topbar-right">
          <span id="studentIdentity" class="teacher-identity">Student</span>
        </div>
      </header>

      <div class="section-grid two-columns">
        <div class="panel-card">
          <div class="panel-card-header">
            <h3>Nickname</h3>
          </div>

          <div class="stack-controls">
            <input id="nicknameInput" placeholder="Nickname">
            <button id="saveNicknameBtn">Save Nickname</button>
          </div>
        </div>

        <div class="panel-card">
          <div class="panel-card-header">
            <h3>Password</h3>
          </div>

          <div class="stack-controls">
            <input id="currentPasswordInput" type="password" placeholder="Current password">
            <input id="newPasswordInput" type="password" placeholder="New password">
            <button id="savePasswordBtn">Save Password</button>
          </div>
        </div>
      </div>

      <div id="settingsMessage" class="preview-box">Load complete.</div>
    </main>
  </div>

  <script type="module" src="student-settings.js"></script>
<script defer src="shared-ui-fixes.js"></script>
</body>
</html>
