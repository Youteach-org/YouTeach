<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Block Report</title>
  <link rel="stylesheet" href="styles.css?v=titlebar-hamburger-20260916">
  <style>
    .report-controls{display:grid;gap:12px}
    .report-controls-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .report-controls-grid label{display:grid;gap:5px;font-size:11px;font-weight:800;color:#334155}
    .report-controls-grid input,.report-controls-grid select{width:100%}
    .report-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .report-paper{background:#fff;color:#111;border:1px solid #d1d5db;padding:24px;max-width:1100px;margin:0 auto}
    .report-heading{text-align:center;display:grid;gap:4px;margin-bottom:14px}
    .report-heading h1{font-size:18px;margin:0}
    .report-heading h2{font-size:15px;margin:0}
    .report-heading p{margin:0;font-size:11px}
    .report-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 14px;margin:12px 0;font-size:11px}
    .report-meta strong{display:block;font-size:9px;text-transform:uppercase;color:#475569}
    .report-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 14px;font-size:10px}
    .report-table{width:100%;border-collapse:collapse;font-size:10px}
    .report-table th,.report-table td{border:1px solid #111;padding:5px 6px;text-align:center}
    .report-table th.name,.report-table td.name{text-align:left;min-width:220px}
    .report-table td.signature{min-width:120px;height:24px}
    .report-footer{display:flex;justify-content:space-between;gap:30px;margin-top:34px;font-size:10px}
    .signature-line{width:260px;border-top:1px solid #111;text-align:center;padding-top:5px}
    .report-empty{padding:20px;text-align:center;color:#64748b}
    @media(max-width:850px){
      .report-controls-grid{grid-template-columns:1fr}
      .report-meta{grid-template-columns:1fr 1fr}
      .report-paper{padding:14px;overflow:auto}
    }
    @media print{
      .sidebar,.hamburger-btn,.topbar,.report-controls-card{display:none!important}
      .menu-shell,.main-content{display:block!important;margin:0!important;padding:0!important}
      body{background:#fff!important}
      .report-paper{border:0;padding:0;max-width:none}
      @page{size:landscape;margin:10mm}
    }
  </style>
</head>
<body>
  <button id="menuToggle" class="hamburger-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
  <div class="menu-shell">
    <aside id="sidebar" class="sidebar collapsible-sidebar">
      <div class="sidebar-content">
        <div class="brand"><h1>YouTeach</h1><p>Teacher Menu</p></div>
        <div id="sidebarIdentity" class="sidebar-identity">Teacher</div>
        <div class="sidebar-links">
          <a class="sidebar-link" href="buzzer.html">Buzzer</a>
          <a class="sidebar-link" href="teacher.html">Teacher Home</a>
          <a class="sidebar-link" href="teacher-students.html">Students</a>
          <a class="sidebar-link" href="teacher-enrollment.html">Group Management</a>
          <a class="sidebar-link" href="teacher-active.html">Active Today</a>
          <a class="sidebar-link" href="teacher-points.html">Points / Export</a>
          <a class="sidebar-link" href="teacher-history.html">History</a>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div><h2>Block Report</h2><p>Generate the end-of-block grade report from the group's evaluation criteria.</p></div>
        <div class="topbar-right"><span id="teacherIdentity" class="teacher-identity">Teacher</span></div>
      </header>

      <section class="panel-card report-controls-card">
        <div class="panel-card-header"><h3>Report Setup</h3></div>
        <div class="report-controls">
          <div class="report-controls-grid">
            <label>Group
              <select id="reportGroupSelect"><option value="">Select group</option></select>
            </label>
            <label>Block / Unit
              <select id="reportBlockSelect"><option value="Block 1">Block 1</option></select>
            </label>
            <label>Report title
              <input id="reportTitleInput" placeholder="Block Grade Report">
            </label>
            <label>Organization
              <input id="reportOrganizationInput" placeholder="School / organization">
            </label>
            <label>Department
              <input id="reportDepartmentInput" placeholder="Department">
            </label>
            <label>Period
              <input id="reportPeriodInput" placeholder="Term / semester">
            </label>
            <label>Course / Program
              <input id="reportCourseInput" placeholder="Course, language, or program">
            </label>
            <label>Parallel groups
              <input id="reportParallelsInput" placeholder="Optional">
            </label>
            <label>Student signature column
              <select id="reportSignatureSelect">
                <option value="yes">Include</option>
                <option value="no">Do not include</option>
              </select>
            </label>
          </div>
          <div class="report-actions">
            <button id="saveReportSettingsBtn" type="button">Save Report Setup for Group</button>
            <button id="printReportBtn" type="button">Print / Save PDF</button>
            <span id="reportStatus" class="status-text"></span>
          </div>
        </div>
      </section>

      <section id="reportPaper" class="report-paper">
        <div class="report-empty">Select a configured group to generate the block report.</div>
      </section>
    </main>
  </div>

  <script type="module" src="teacher-block-report.js?v=dynamic-evaluation-20260920"></script>
  <script defer src="shared-ui-fixes.js?v=titlebar-hamburger-20260916"></script>
</body>
</html>
