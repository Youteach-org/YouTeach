<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Student Buzzer</title>
  <link rel="stylesheet" href="styles.css?v=titlebar-hamburger-20260916">

  <style>
    .student-buzzer-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      justify-content: center;
      padding: 10px 14px 10px 14px;
    }

    .student-buzzer-name {
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 700;
      text-align: center;
      margin: 0;
    }

    .student-buzzer-team {
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 700;
      color: #1d4ed8;
      margin: 0;
    }

    .student-buzzer-status {
      font-size: 16px;
      color: #475569;
      margin: 0;
    }

    .student-buzzer-button-wrap {
      width: min(92vw, 520px);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .student-buzz-btn {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #dc2626;
      color: white;
      font-size: clamp(36px, 10vw, 64px);
      font-weight: 700;
      border: none;
      box-shadow: 0 16px 30px rgba(220,38,38,0.35);
    }

    .student-scoreboard-strip {
      width: min(94vw, 760px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .student-score-card {
      background: #ffffff;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }

    .student-score-card strong {
      font-size: 18px;
      color: #1d4ed8;
    }
      .score-number {
      font-size: 22px;
      font-weight: 800;
      color: #1d4ed8;
      margin-left: 4px;
    }
    .score-number {
      font-size: 22px;
      font-weight: 800;
      color: #1d4ed8;
      margin-left: 4px;
    }
    .student-score-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .score-team-label {
      font-size: 16px !important;
      color: #0f172a !important;
      margin: 0 !important;
    }

    .score-number {
      font-size: 22px !important;
      font-weight: 900 !important;
      color: #1d4ed8 !important;
      line-height: 1 !important;
    }
  </style>
</head>

<body>

<button id="menuToggle" class="hamburger-btn">
  <span></span><span></span><span></span>
</button>

<div class="menu-shell">
<aside id="sidebar" class="sidebar collapsible-sidebar">
<div class="sidebar-content">
<div class="brand">
<h1>YouTeach</h1>
<p>Student Menu</p>
</div>

<div id="sidebarIdentity" class="sidebar-identity">Student</div>

<div class="sidebar-links">
<a class="sidebar-link active-link" href="student-buzzer.html">Buzzer</a>
<button id="openVerbRunnerBtn" class="sidebar-link" type="button">Verb Runner</button>
<a class="sidebar-link" href="student-summary.html">My Summary</a>
<a class="sidebar-link" href="student-settings.html">Settings</a>
<button id="logoutBtn" class="logout-btn">Logout</button>
</div>
</div>
</aside>

<main class="main-content">



<div class="student-buzzer-shell">

<h1 id="studentName" class="student-buzzer-name">Student</h1>
<p id="studentTeam" class="student-buzzer-team">No team</p>
<p id="studentStatus" class="student-buzzer-status">Waiting...</p>
<div id="gameTurnCard" class="student-score-card" hidden>
  <span id="gameTurnLabel">100 Students Said</span>
  <strong id="gameTurnPosition">Waiting for turn</strong>
</div>

<div class="student-buzzer-button-wrap">
<button id="buzzBtn" class="student-buzz-btn">BUZZ</button>
</div>

<div id="activityScoresStrip" class="student-scoreboard-strip">
<div class="student-score-card">
<span>No scores yet</span>
<strong>0</strong>
</div>
</div>

</div>
</main>
</div>


<script type="module" src="student-buzzer.js?v=verb-runner-credentials-20260915-1"></script>
<script defer src="shared-ui-fixes.js?v=titlebar-hamburger-20260916"></script>

</body>
</html>
