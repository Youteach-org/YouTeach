<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Student Buzzer</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .student-buzzer-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
      padding: 24px 18px 28px 18px;
    }

    .student-buzzer-name {
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 700;
      text-align: center;
      line-height: 1.1;
      margin: 0;
    }

    .student-buzzer-team {
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 700;
      color: #1d4ed8;
      text-align: center;
      margin: 0;
    }

    .student-buzzer-status {
      font-size: 16px;
      color: #475569;
      text-align: center;
      margin: 0;
    }

    .student-scoreboard-strip {
      width: min(94vw, 760px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
    }

    .student-score-card {
      background: #ffffff;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(15,23,42,0.04);
    }

    .student-score-card span {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .student-score-card strong {
      display: block;
      font-size: 18px;
      color: #1d4ed8;
      line-height: 1.1;
    }

    .student-buzzer-button-wrap {
      width: min(92vw, 520px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .student-buzz-btn {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 50%;
      background: #dc2626;
      color: #ffffff;
      font-size: clamp(36px, 10vw, 64px);
      font-weight: 700;
      box-shadow: 0 16px 30px rgba(220,38,38,0.35);
    }

    .student-buzz-btn:hover {
      background: #b91c1c;
    }

    .student-buzz-btn:disabled {
      background: #94a3b8;
      box-shadow: none;
    }

    @media (max-width: 600px) {
      .student-buzzer-shell {
        justify-content: flex-start;
        padding-top: 90px;
      }

      .student-buzzer-button-wrap {
        width: 94vw;
      }

      .student-scoreboard-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <button id="menuToggle" class="hamburger-btn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>

  <div class="menu-shell">
    <aside id="sidebar" class="sidebar collapsible-sidebar">
  <div class="sidebar-content">
    <div class="brand">
      <h1>YouTeach</h1>
      <p>Student Menu</p>
    </div>

    <div id="sidebarIdentity" class="sidebar-identity">Student</div>

    <div class="sidebar-links">
        <a class="sidebar-link active-link" href="student-buzzer.html">Buzzer</a>
        <a class="sidebar-link" href="student-summary.html">My Summary</a>
        <a class="sidebar-link" href="student-settings.html">Settings</a>
        <button id="logoutBtn" class="logout-btn">Logout</button>
          </div>
  </div>
</aside>

    <main class="main-content">
      <div id="attendanceStatusBar" class="panel-card" style="margin-bottom:16px;">
        <strong>Current status today:</strong> <span id="attendanceStatusText">Checking...</span>
      </div>

      <div class="student-buzzer-shell">
        <h1 id="studentName" class="student-buzzer-name">Student</h1>
        <p id="studentTeam" class="student-buzzer-team">No team</p>
        <p id="studentStatus" class="student-buzzer-status">Waiting...</p>

        <div id="activityScoresStrip" class="student-scoreboard-strip">
          <div class="student-score-card">
            <span>No scores yet</span>
            <strong>0</strong>
          </div>
        </div>

        <div class="student-buzzer-button-wrap">
          <button id="buzzBtn" class="student-buzz-btn">BUZZ</button>
        </div>
      </div>
    </main>
  </div>

  <audio id="buzzSound" preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
  </audio>

  <script type="module" src="student-buzzer.js"></script>
  <script defer src="shared-ui-fixes.js"></script>
</body>
</html>
