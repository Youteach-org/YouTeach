<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}

#name {
  font-size: 28px;
  margin-top: 20px;
}

#team {
  font-size: 20px;
  margin-bottom: 20px;
}

#buzz {
  width: 90vw;
  height: 60vh;
  border-radius: 50%;
  background: red;
  border: none;
  font-size: 40px;
  color: white;
}
</style>
</head>

<body>

<div id="name"></div>
<div id="team"></div>

<button id="buzz">BUZZ</button>

<audio id="sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script type="module">
import { requireStudentSession } from "./student-auth.js";

const session = requireStudentSession();

document.getElementById("name").textContent = session.externalId;

document.getElementById("buzz").onclick = () => {
  document.getElementById("sound").play();
};
</script>

</body>
</html>
