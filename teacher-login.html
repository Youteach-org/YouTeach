<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Teacher Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card small-auth-card">
      <h1>YouTeach</h1>
      <h2>Teacher Login</h2>

      <div class="stack-controls">
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button id="loginBtn">Login</button>
        <p id="loginMessage" class="status-text"></p>
      </div>

      <div class="hint-box">
        <strong>Default users</strong><br>
        teacher / teacher123<br>
        admin / admin123
      </div>
    </div>
  </div>

  <script type="module" src="teacher-login.js"></script>
<script defer src="shared-ui-fixes.js?v=fix-20260508114809"></script>
<script type="module" src="login-enhancements.js"></script>
</body>
</html>
