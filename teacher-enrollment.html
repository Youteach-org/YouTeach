<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Add / Import</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="menuToggle" class="hamburger-btn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>

  <div class="menu-shell">
    <aside id="sidebar" class="sidebar collapsible-sidebar">
      <div class="brand">
        <h1>YouTeach</h1>
        <p>Teacher Menu</p>
      </div>

      <div class="sidebar-links">
        <a class="sidebar-link" href="teacher.html">Teacher Home</a>
        <a class="sidebar-link" href="teacher-students.html">Students</a>
        <a class="sidebar-link active-link" href="teacher-enrollment.html">Add / Import</a>
        <a class="sidebar-link" href="teacher-points.html">Points / Export</a>
        <a class="sidebar-link" href="teacher-history.html">History</a>
        <a class="sidebar-link" href="buzzer.html">Buzzer</a>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h2>Add / Import</h2>
          <p>Create students manually or import a list</p>
        </div>
        <div class="topbar-right">
          <span id="teacherIdentity" class="teacher-identity">Teacher</span>
        </div>
      </header>

      <div class="section-grid two-columns">
        <div class="panel-card">
          <div class="panel-card-header">
            <h3>Add Student</h3>
          </div>

          <div class="stack-controls">
            <input id="studentName" placeholder="Full name">
            <input id="studentNickname" placeholder="Nickname">
            <input id="studentNumberManual" placeholder="External ID">
            <button id="createStudent">Add Student</button>
          </div>
        </div>

        <div class="panel-card">
          <div class="panel-card-header">
            <h3>Import CSV</h3>
          </div>

          <div class="stack-controls">
            <input id="csvFile" type="file" accept=".csv">
            <button id="importCsv">Import CSV</button>
          </div>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-card-header">
          <h3>Paste Student List</h3>
        </div>

        <div class="stack-controls">
          <textarea id="bulkText" rows="12" placeholder="25NC07776    ABURTO GONZALEZ KARLA PAULINA"></textarea>
          <button id="importText">Import Pasted List</button>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="teacher-enrollment.js"></script>
</body>
</html>
