<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - My Assignments</title>
  <link rel="stylesheet" href="styles.css?v=titlebar-hamburger-20260916">
  <style>
    *{box-sizing:border-box}
    .main-content{min-width:0}
    .topbar{align-items:center}
    .student-top-identity{
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border:1px solid #dbeafe;
      border-radius:12px;
      background:#f8fafc;
      min-width:0
    }
    .student-top-identity strong{
      font-size:14px;
      color:#0f172a;
      white-space:nowrap
    }
    .student-top-identity span{
      font-size:12px;
      color:#64748b;
      white-space:nowrap
    }

    .assignment-grid{
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      gap:10px;
      align-items:start
    }
    .assignment-card{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:7px;
      background:#fff;
      border:1px solid #dbeafe;
      border-radius:14px;
      padding:11px;
      box-shadow:0 3px 12px rgba(15,23,42,.05)
    }
    .assignment-code{
      font-size:11px;
      font-weight:900;
      color:#2563eb;
      line-height:1.2;
      overflow-wrap:anywhere
    }
    .assignment-card h3{
      margin:0;
      font-size:15px;
      line-height:1.2;
      color:#0f172a;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
      min-height:36px
    }
    .assignment-meta{
      display:flex;
      flex-wrap:wrap;
      gap:4px;
      margin:0;
      color:#475569;
      font-size:10px
    }
    .assignment-chip{
      background:#eff6ff;
      border-radius:999px;
      padding:3px 6px;
      white-space:nowrap
    }
    .assignment-instructions{
      color:#334155;
      font-size:11px;
      line-height:1.35;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
      min-height:30px
    }
    .submission-row{
      display:grid;
      gap:2px;
      margin:0;
      padding:7px;
      background:#f1f5f9;
      border-radius:8px;
      font-size:10px;
      min-width:0
    }
    .submission-row span{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap
    }
    .assignment-status{
      margin:0;
      padding:7px 8px;
      border-radius:8px;
      font-size:11px;
      font-weight:900;
      line-height:1.25
    }
    .assignment-status.ok{color:#166534;background:#dcfce7;border:1px solid #86efac}
    .assignment-status.bad{color:#991b1b;background:#fee2e2;border:1px solid #fca5a5}
    .assignment-status.pending{color:#854d0e;background:#fef9c3;border:1px solid #fde047}
    .assignment-status.warning{color:#9a3412;background:#ffedd5;border:1px solid #fdba74}

    .upload-box{
      margin-top:auto;
      padding:8px;
      border:1px dashed #93c5fd;
      border-radius:10px;
      background:#f8fbff;
      min-width:0
    }
    .upload-box strong{
      display:block;
      margin-bottom:6px;
      font-size:11px;
      color:#0f172a
    }
    .file-picker{
      display:flex;
      align-items:center;
      gap:6px;
      min-width:0
    }
    .file-picker input[type="file"]{
      position:absolute;
      width:1px;
      height:1px;
      opacity:0;
      pointer-events:none
    }
    .file-picker-label{
      flex:0 0 auto;
      padding:6px 7px;
      border:1px solid #cbd5e1;
      border-radius:7px;
      background:#fff;
      font-size:10px;
      font-weight:800;
      cursor:pointer
    }
    .file-picker-label.disabled{
      opacity:.5;
      cursor:not-allowed
    }
    .file-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:10px;
      color:#64748b
    }
    .upload-btn,.undo-submission-btn{
      width:100%;
      margin-top:6px;
      min-height:32px;
      padding:6px 8px;
      font-size:11px;
      font-weight:800
    }
    .undo-submission-btn{
      background:#fff;
      border:1px solid #dc2626;
      color:#b91c1c
    }
    .undo-submission-btn:hover{background:#fef2f2}
    .upload-btn:disabled,.undo-submission-btn:disabled{opacity:.55;cursor:not-allowed}
    .progress-text{
      margin-top:5px;
      color:#475569;
      font-size:10px;
      line-height:1.25
    }
    .published-grade{
      padding:7px 8px;
      border:1px solid #86efac;
      border-radius:9px;
      background:#f0fdf4;
      color:#166534
    }
    .published-grade-total{font-size:12px;font-weight:900}
    .published-grade-breakdown{display:grid;gap:4px;margin-top:7px}
    .published-grade-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding-top:4px;
      border-top:1px solid #dcfce7;
      font-size:11px
    }
    .published-grade-feedback{
      margin-top:8px;
      padding-top:7px;
      border-top:1px solid #dcfce7;
      font-size:11px;
      line-height:1.4;
      color:#14532d
    }

    .open-graded-exam-btn{
      width:100%;
      margin-top:8px;
      padding:7px 9px;
      border:1px solid #86efac;
      border-radius:8px;
      background:#fff;
      color:#166534;
      font-size:10px;
      font-weight:900
    }
    .open-graded-exam-btn:hover{background:#dcfce7}
    .assignment-card.expanded{
      grid-column:span 3;
      min-height:0;
      box-shadow:0 10px 28px rgba(15,23,42,.12);
      border-color:#93c5fd
    }
    .assignment-card.expanded h3{
      display:block;
      min-height:0;
      font-size:20px
    }
    .assignment-card.expanded .assignment-instructions{
      display:block;
      -webkit-line-clamp:unset;
      overflow:visible;
      min-height:0;
      white-space:pre-wrap;
      font-size:13px;
      line-height:1.5
    }
    .assignment-card.expanded .submission-row{font-size:11px}
    .assignment-card.expanded .upload-box{margin-top:4px}
    .project-progress-summary{
      padding:6px 7px;
      border:1px solid #ddd6fe;
      border-radius:8px;
      background:#f5f3ff;
      color:#6d28d9;
      font-size:10px;
      font-weight:900
    }
    .project-progress-empty{
      padding:7px;
      border:1px solid #e2e8f0;
      border-radius:8px;
      background:#f8fafc;
      color:#64748b;
      font-size:10px
    }
    .student-project-progress{
      display:grid;
      gap:7px;
      padding:8px;
      border:1px solid #ddd6fe;
      border-radius:10px;
      background:#faf5ff
    }
    .student-project-progress-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px
    }
    .student-project-progress-head strong{font-size:12px;color:#5b21b6}
    .student-project-progress-head span{font-size:9px;color:#7c3aed;font-weight:800}
    .student-project-checkpoints{display:grid;gap:7px}
    .student-project-checkpoint{
      display:grid;
      gap:6px;
      padding:8px;
      border:1px solid #e9d5ff;
      border-radius:9px;
      background:#fff
    }
    .student-project-checkpoint-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:8px
    }
    .student-project-checkpoint-head>div{min-width:0}
    .student-project-checkpoint-head strong{display:block;font-size:11px;color:#0f172a}
    .student-project-checkpoint-head span{display:block;margin-top:2px;font-size:9px;color:#64748b}
    .checkpoint-state{
      flex:0 0 auto;
      padding:3px 5px;
      border-radius:999px;
      font-size:8px!important;
      font-weight:900
    }
    .checkpoint-state.open{background:#dcfce7;color:#166534!important}
    .checkpoint-state.closed{background:#fee2e2;color:#991b1b!important}
    .student-project-checkpoint-instructions{font-size:10px;line-height:1.35;color:#334155}
    .student-project-evidence-list{display:grid;gap:4px}
    .student-project-evidence{
      display:grid;
      gap:2px;
      padding:5px 6px;
      border:1px solid #e2e8f0;
      border-radius:7px;
      background:#f8fafc
    }
    .student-project-evidence a{font-size:9px;font-weight:900}
    .student-project-evidence span,.student-project-evidence small{font-size:8px;color:#64748b}
    .student-project-evidence-empty{font-size:9px;color:#94a3b8}
    .student-project-upload{
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      gap:5px;
      align-items:center
    }
    .student-project-upload input[type="file"]{
      position:absolute;
      width:1px;
      height:1px;
      opacity:0;
      pointer-events:none
    }
    .student-project-upload button{
      padding:6px 8px;
      font-size:9px;
      font-weight:900;
      white-space:nowrap
    }
    .student-project-upload .progress-text{grid-column:1/-1;margin:0}

    .empty-state{
      grid-column:1/-1;
      padding:28px;
      text-align:center;
      color:#64748b
    }

    @media(max-width:1199px){
      .assignment-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .assignment-card.expanded{grid-column:span 4}
    }
    @media(max-width:900px){
      .assignment-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .assignment-card.expanded{grid-column:span 3}
    }
    @media(max-width:680px){
      .assignment-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .assignment-card.expanded{grid-column:span 2}
      .student-top-identity{align-items:flex-start;flex-direction:column;gap:2px}
    }
    @media(max-width:480px){
      .assignment-grid{grid-template-columns:1fr}
      .assignment-card.expanded{grid-column:span 1}
    }
  </style>
</head>
<body>
  <button id="menuToggle" class="hamburger-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
  <div class="menu-shell">
    <aside id="sidebar" class="sidebar collapsible-sidebar">
      <div class="sidebar-content">
        <div class="brand"><h1>YouTeach</h1><p>Student Menu</p></div>
        <div id="sidebarIdentity" class="sidebar-identity">Student</div>
        <div class="sidebar-links">
          <a class="sidebar-link" href="student-buzzer.html">Buzzer</a>
          <a class="sidebar-link active-link" href="student-assignments.html">My Assignments</a>
          <a class="sidebar-link" href="student-summary.html">My Summary</a>
          <a class="sidebar-link" href="student-settings.html">Settings</a>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h2>My Assignments</h2>
          <p>Final PDFs · project progress evidence · published grades</p>
        </div>
        <div class="topbar-right">
          <div class="student-top-identity">
            <strong id="studentIdentity">Student</strong>
            <span id="studentAssignmentIdentity">Loading student...</span>
          </div>
        </div>
      </header>

      <div id="assignmentList" class="assignment-grid">
        <div class="empty-state">Loading assignments...</div>
      </div>
    </main>
  </div>

  <script type="module" src="student-assignments.js?v=exam-annotations-20260916"></script>
  <script defer src="shared-ui-fixes.js?v=titlebar-hamburger-20260916"></script>
</body>
</html>
