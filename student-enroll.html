<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Group Enrollment</title>
  <link rel="stylesheet" href="styles.css?v=titlebar-hamburger-20260916">
  <style>
    .enroll-shell{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f8fafc}
    .enroll-card{width:min(620px,100%);background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:22px;box-shadow:0 18px 60px rgba(15,23,42,.12)}
    .enroll-card h1{margin:0 0 4px}.enroll-card h2{margin:0 0 14px}
    .group-chip{display:inline-flex;padding:6px 10px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-weight:900;font-size:12px;margin-bottom:14px}
    .enroll-form{display:grid;gap:10px}
    .enroll-form label{display:grid;gap:5px;font-size:12px;font-weight:800;color:#334155}
    .enroll-form input{width:100%}
    .enroll-status{margin-top:12px}
    .enroll-status.ok{color:#166534}.enroll-status.bad{color:#b91c1c}
    .privacy-note{font-size:11px;color:#64748b;line-height:1.45}
  </style>
</head>
<body>
  <main class="enroll-shell">
    <section class="enroll-card">
      <h1>YouTeach</h1>
      <h2>Request Group Enrollment</h2>
      <div id="enrollmentGroupChip" class="group-chip">Checking invitation…</div>

      <div id="invalidEnrollmentMessage" class="status-text bad" hidden>
        This enrollment link is invalid or no longer active. Ask your teacher for a new link.
      </div>

      <form id="enrollmentRequestForm" class="enroll-form" hidden>
        <label>Full name
          <input id="enrollmentFullName" autocomplete="name" required placeholder="Your full name">
        </label>
        <label>Nickname
          <input id="enrollmentNickname" placeholder="What should your teacher call you?">
        </label>
        <label>External ID <span style="font-weight:400;">(optional)</span>
          <input id="enrollmentExternalId" placeholder="Leave blank if you do not know it">
        </label>
        <div class="privacy-note">
          Sending this form creates a pending request only. You become an enrolled student after your teacher approves it.
        </div>
        <button id="submitEnrollmentRequestBtn" type="submit">Request Enrollment</button>
      </form>

      <div id="enrollmentRequestStatus" class="enroll-status status-text" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="student-enroll.js?v=group-management-20260920"></script>
</body>
</html>
