<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Question Bank</title>
  <link rel="stylesheet" href="styles.css?v=titlebar-hamburger-20260916">
  <style>
    *{box-sizing:border-box}
    .bank-page{display:grid;gap:12px;min-width:0}
    .bank-toolbar{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(4,minmax(120px,.7fr)) auto;gap:7px;align-items:end}
    .bank-toolbar label,.question-form label{display:grid;gap:4px;font-size:9px;font-weight:900;color:#475569}
    .bank-toolbar input,.bank-toolbar select,.question-form input,.question-form select,.question-form textarea{
      width:100%;min-width:0;padding:7px 8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit;font-size:10px
    }
    .question-form textarea{min-height:66px;resize:vertical}
    .bank-layout{display:grid;grid-template-columns:minmax(340px,.9fr) minmax(0,1.6fr);gap:12px;align-items:start}
    .bank-panel{background:#fff;border:1px solid #dbeafe;border-radius:12px;padding:11px;min-width:0}
    .bank-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .bank-panel-head h3{margin:0;font-size:15px;color:#0f172a}
    .question-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
    .question-form .wide{grid-column:1/-1}
    .options-editor,.matching-editor{display:grid;gap:5px}
    .option-row,.matching-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:5px;align-items:center}
    .matching-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
    .option-row button,.matching-row button{padding:5px 7px;font-size:9px}
    .form-actions{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .form-actions button{padding:7px 10px;font-size:10px}
    .question-list{display:grid;gap:7px}
    .question-card{display:grid;gap:5px;padding:8px;border:1px solid #e2e8f0;border-radius:9px;background:#f8fafc}
    .question-card.archived{opacity:.55}
    .question-card-head{display:flex;justify-content:space-between;gap:8px}
    .question-card h4{margin:0;font-size:11px;color:#0f172a}
    .question-card p{margin:0;font-size:9px;line-height:1.35;color:#475569;white-space:pre-wrap}
    .question-meta{display:flex;flex-wrap:wrap;gap:4px}
    .question-chip{padding:3px 5px;border-radius:999px;background:#e0e7ff;color:#3730a3;font-size:8px;font-weight:900}
    .question-card-actions{display:flex;gap:5px;flex-wrap:wrap}
    .question-card-actions button{padding:5px 7px;font-size:8px}
    .empty-state{padding:18px;text-align:center;color:#64748b}
    @media(max-width:1050px){
      .bank-toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}
      .bank-layout{grid-template-columns:1fr}
    }
    @media(max-width:650px){
      .bank-toolbar,.question-form{grid-template-columns:1fr}
      .question-form .wide{grid-column:auto}
    }
  </style>
</head>
<body>
  <button id="menuToggle" class="hamburger-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
  <div class="menu-shell">
    <aside id="sidebar" class="sidebar collapsible-sidebar">
      <div class="sidebar-content">
        <div class="brand"><h1>YouTeach</h1><p>Teacher Menu</p></div>
        <div id="sidebarIdentity" class="sidebar-identity">Teacher</div>
        <div class="sidebar-links">
          <a class="sidebar-link" href="buzzer.html">Buzzer</a>
          <a class="sidebar-link" href="teacher.html">Teacher Home</a>
          <a class="sidebar-link" href="teacher-assignments.html">Assignments</a>
          <a class="sidebar-link active-link" href="exam-question-bank.html">Question Bank</a>
          <a class="sidebar-link" href="exam-creator.html">Exam Creator</a>
          <a class="sidebar-link" href="answer-sheet-creator.html">Answer Sheet Creator</a>
          <a class="sidebar-link" href="teacher-students.html">Students</a>
          <a class="sidebar-link" href="teacher-enrollment.html">Groups / Import</a>
          <a class="sidebar-link" href="teacher-history.html">History</a>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div><h2>Question Bank</h2><p>Reusable exam questions with one canonical answer key.</p></div>
        <div class="topbar-right"><span id="teacherIdentity" class="teacher-identity">Teacher</span></div>
      </header>
      <div class="bank-page">
        <section class="bank-panel">
          <div class="bank-toolbar">
            <label>Search<input id="filterSearch" type="search" placeholder="Prompt, tag, topic..."></label>
            <label>Course<input id="filterCourse" placeholder="All"></label>
            <label>Unit<input id="filterUnit" placeholder="All"></label>
            <label>Topic<input id="filterTopic" placeholder="All"></label>
            <label>Type
              <select id="filterType">
                <option value="">All</option>
                <option value="multiple-choice">Multiple choice</option>
                <option value="true-false">True / False</option>
                <option value="matching">Matching</option>
                <option value="open-response">Open response</option>
              </select>
            </label>
            <button id="newQuestionBtn" type="button">+ New question</button>
          </div>
        </section>
        <div class="bank-layout">
          <section class="bank-panel">
            <div class="bank-panel-head"><h3 id="formTitle">New Question</h3><span id="formStatus" class="status-text"></span></div>
            <form id="questionForm" class="question-form">
              <label>Type
                <select id="questionType">
                  <option value="multiple-choice">Multiple choice</option>
                  <option value="true-false">True / False</option>
                  <option value="matching">Matching</option>
                  <option value="open-response">Open response</option>
                </select>
              </label>
              <label>Points<input id="pointValue" type="number" min="0.1" step="0.1" value="1"></label>
              <label class="wide">Prompt<textarea id="promptText" required></textarea></label>
              <label>Course<input id="courseText"></label>
              <label>Unit<input id="unitText"></label>
              <label>Topic<input id="topicText"></label>
              <label>Subtopic<input id="subtopicText"></label>
              <label>Difficulty
                <select id="difficultyText">
                  <option value="unspecified">Unspecified</option>
                  <option value="easy">Easy</option>
                  <option value="medium">Medium</option>
                  <option value="hard">Hard</option>
                </select>
              </label>
              <label>Tags<input id="tagsText" placeholder="comma, separated"></label>
              <div id="multipleChoiceFields" class="wide">
                <div class="bank-panel-head"><h3>Options</h3><button id="addOptionBtn" type="button">+ Option</button></div>
                <div id="optionsEditor" class="options-editor"></div>
              </div>
              <div id="trueFalseFields" class="wide" hidden>
                <label>Correct answer
                  <select id="trueFalseAnswer"><option value="true">True</option><option value="false">False</option></select>
                </label>
              </div>
              <div id="matchingFields" class="wide" hidden>
                <div class="bank-panel-head"><h3>Matching pairs</h3><button id="addMatchingBtn" type="button">+ Pair</button></div>
                <div id="matchingEditor" class="matching-editor"></div>
              </div>
              <div id="openResponseFields" class="wide" hidden>
                <label>Answer key / expected response<textarea id="openAnswer"></textarea></label>
              </div>
              <label class="wide">Teacher explanation / rationale<textarea id="rationaleText"></textarea></label>
              <label class="wide">Source / reference notes<textarea id="sourceNotesText"></textarea></label>
              <div class="form-actions">
                <button id="saveQuestionBtn" type="submit">Save question</button>
                <button id="cancelEditBtn" type="button" hidden>Cancel edit</button>
              </div>
            </form>
          </section>
          <section class="bank-panel">
            <div class="bank-panel-head"><h3>Questions</h3><span id="questionCount">0</span></div>
            <div id="questionList" class="question-list"><div class="empty-state">Loading...</div></div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="exam-question-bank.js?v=20260916"></script>
  <script defer src="shared-ui-fixes.js?v=titlebar-hamburger-20260916"></script>
</body>
</html>
