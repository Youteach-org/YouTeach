<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Points / Export</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="menu-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>YouTeach</h1>
        <p>Teacher Menu</p>
      </div>

      <div class="sidebar-links">
        <a class="sidebar-link" href="teacher.html">Teacher Home</a>
        <a class="sidebar-link" href="teacher-students.html">Students</a>
        <a class="sidebar-link" href="teacher-enrollment.html">Add / Import</a>
        <a class="sidebar-link active-link" href="teacher-points.html">Points / Export</a>
        <a class="sidebar-link" href="teacher-history.html">History</a>
        <a class="sidebar-link" href="buzzer.html">Buzzer</a>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h2>Points / Export</h2>
          <p>Adjust student points and export block results</p>
        </div>
        <div class="topbar-right">
          <span id="teacherIdentity" class="teacher-identity">Teacher</span>
        </div>
      </header>

      <div class="section-grid two-columns">
        <div class="panel-card">
          <div class="panel-card-header">
            <h3>Adjust Student Points</h3>
          </div>

          <div class="stack-controls">
            <input id="manualStudentSearch" placeholder="Find student by name, nickname, student number, or internal ID">
            <select id="manualStudentSelect">
              <option value="">Select a student</option>
            </select>
            <select id="manualBlockSelect">
              <option value="Block 1">Block 1</option>
              <option value="Block 2">Block 2</option>
              <option value="Block 3">Block 3</option>
            </select>
            <input id="manualPointsInput" type="number" step="1" placeholder="Use positive or negative number">
            <button id="applyManualPointsBtn">Update Points</button>
          </div>

          <div id="manualStudentPreview" class="preview-box">No student selected.</div>
        </div>

        <div class="panel-card">
          <div class="panel-card-header">
            <h3>Block Control / Export</h3>
          </div>

          <div class="stack-controls">
            <select id="activeBlockSelect">
              <option value="Block 1">Block 1</option>
              <option value="Block 2">Block 2</option>
              <option value="Block 3">Block 3</option>
            </select>
            <button id="saveBlockBtn">Save Active Block</button>
            <button id="closeBlockBtn">Close Block</button>
            <button id="reopenBlockBtn">Reopen Block</button>

            <select id="exportBlockSelect">
              <option value="Block 1">Block 1</option>
              <option value="Block 2">Block 2</option>
              <option value="Block 3">Block 3</option>
            </select>
            <button id="exportBlockBtn">Download CSV</button>
          </div>

          <div class="preview-box">
            <div id="currentBlockLabel">Current active block: Block 1</div>
            <div id="currentBlockStatusLabel">Current block status: OPEN</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="teacher-points.js"></script>
</body>
</html>
