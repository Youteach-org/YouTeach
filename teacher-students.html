<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Students</title>
  <link rel="stylesheet" href="styles.css?v=titlebar-hamburger-20260916">
  <style>
    .students-summary-grid{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(260px,1fr);gap:12px;margin-bottom:12px}
    .students-actions{display:flex;justify-content:flex-end;margin:8px 0}
    .student-row{cursor:pointer}
    .student-row:hover{background:#f8fafc}
    .summary-inline{display:flex;align-items:center;gap:10px;min-width:0}
    .summary-inline .summary-label{white-space:nowrap}
    .group-select{flex:1;min-width:0;margin:0}
    .students-count-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .students-count-inline{display:flex;align-items:center;gap:8px;white-space:nowrap}
    .students-count-value{font-size:18px;font-weight:900;color:#0f172a}
    .student-search-tools{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
    .search-toggle-btn{min-width:42px;min-height:38px;padding:5px 9px;font-size:24px;line-height:1}
    .student-search-panel{margin:0;min-width:220px;max-width:360px}
    .student-search-panel input{width:100%;margin:0}
    .students-table-wrap{overflow-x:auto;position:relative}
    .students-table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
    .student-column-header,.student-identity-cell{position:sticky;left:0;min-width:270px;max-width:310px}
    .student-column-header{z-index:5;background:#f8fafc}
    .student-identity-cell{z-index:2;background:#fff}
    .student-name-line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .student-name{font-weight:900;line-height:1.15;color:#0f172a;display:block;max-width:100%;overflow-wrap:anywhere}
    .student-meta{display:flex;flex-direction:column;align-items:flex-start;gap:1px;margin-top:3px;font-size:9px;line-height:1.25;color:#64748b}
    .student-meta-line{font-size:9px;font-weight:500;color:#64748b}
    @media(max-width:760px){.students-summary-grid{grid-template-columns:1fr}.student-column-header,.student-identity-cell{min-width:220px;max-width:250px}.students-count-head{align-items:flex-start}.student-search-tools{flex:1}.student-search-panel{min-width:0;max-width:none;flex:1}}
    .student-row.active-student{background:#ecfdf5}
    .student-row.active-student:hover{background:#dcfce7}
    .student-row.active-student .student-identity-cell{background:#ecfdf5}
    .block-grade-cell{min-width:260px;text-align:center}
    .block-grade-setup-required{font-size:10px;font-weight:900;color:#b45309}
    .block-grade-header{min-width:260px;text-align:center;vertical-align:top}
    .block-header-title{display:block;font-size:13px;font-weight:900;color:#0f172a;white-space:nowrap}
    .block-criteria-grid,.block-values-grid{display:grid;grid-template-columns:repeat(var(--criterion-columns),minmax(48px,1fr));gap:4px;align-items:center}
    .block-criteria-grid{margin-top:5px;font-size:9px;line-height:1.25;font-weight:800;color:#64748b}
    .block-values-grid{font-size:11px;font-weight:800;color:#334155}
    .block-criterion-label,.block-criterion-value{padding:2px 3px;text-align:center}
    .block-criterion-label{white-space:normal;line-height:1.15}
    .block-criterion-value{white-space:nowrap}
    .block-criterion-total{font-weight:900;color:#92400e;background:#fef3c7;border-radius:6px;padding:4px 5px}

  </style>
</head>
<body>
  <button id="menuToggle" class="hamburger-btn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>

  <div class="menu-shell">
    <aside id="sidebar" class="sidebar collapsible-sidebar">
      <div class="sidebar-content">
        <div class="brand">
          <h1>YouTeach</h1>
          <p>Teacher Menu</p>
        </div>

        <div id="sidebarIdentity" class="sidebar-identity">Teacher</div>

        <div class="sidebar-links">
          <a class="sidebar-link" href="buzzer.html">Buzzer</a>
          <a class="sidebar-link" href="teacher.html">Teacher Home</a>
          <a class="sidebar-link active-link" href="teacher-students.html">Students</a>
          <a class="sidebar-link" href="teacher-enrollment.html">Group Management</a>
          <a class="sidebar-link" href="teacher-active.html">Active Today</a>
          <a class="sidebar-link" href="teacher-points.html">Points / Export</a>
          <a class="sidebar-link" href="teacher-history.html">History</a>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h2>Students</h2>
          <p>View group progress. Double click a student row to open that student's profile.</p>
        </div>
        <div class="topbar-right">
          <span id="teacherIdentity" class="teacher-identity">Teacher</span>
        </div>
      </header>

      <div class="panel-card">
        <div class="students-summary-grid">
          <div class="summary-card mini">
            <div class="summary-inline">
              <span class="summary-label">Selected Group</span>
              <select id="groupFilter" class="group-select" aria-label="Selected group"></select>
            </div>
          </div>

          <div class="summary-card mini">
            <div class="students-count-head">
              <div class="students-count-inline">
                <span class="summary-label">Students in Group</span>
                <div id="studentsInGroupCard" class="students-count-value">0</div>
              </div>
              <div class="student-search-tools">
                <div id="studentSearchPanel" class="student-search-panel" hidden>
                  <input id="searchStudent" placeholder="Search name, nickname, or External ID" autocomplete="off">
                </div>
                <button id="toggleStudentSearchBtn" class="search-toggle-btn" type="button"
                  aria-label="Search students" aria-expanded="false" title="Search students">🔍</button>
              </div>
            </div>
          </div>
        </div>

        <div class="students-actions">
          <button id="openBlockReportBtn" type="button">Block Report</button>
        </div>

        <div class="table-wrap students-table-wrap">
          <table class="data-table students-table">
            <thead>
              <tr>
                <th class="student-column-header">Student</th>
                <th id="blockColumnsPlaceholder">Block Grade</th>
              </tr>
            </thead>
            <tbody id="studentsTableBody">
              <tr><td colspan="2">No students found.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="teacher-students.js?v=adaptive-name-total-panel-20260921"></script>
  <script defer src="shared-ui-fixes.js?v=titlebar-hamburger-20260916"></script>
</body>
</html>
