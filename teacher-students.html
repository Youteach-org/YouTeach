<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Students</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="menuToggle" class="hamburger-btn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>

  <div class="menu-shell">
    <aside id="sidebar" class="sidebar collapsible-sidebar">
      <div class="brand">
        <h1>YouTeach</h1>
        <p>Teacher Menu</p>
      </div>

      <div class="sidebar-links">
        <a class="sidebar-link" href="teacher.html">Teacher Home</a>
        <a class="sidebar-link active-link" href="teacher-students.html">Students</a>
        <a class="sidebar-link" href="teacher-enrollment.html">Add / Import</a>
        <a class="sidebar-link" href="teacher-points.html">Points / Export</a>
        <a class="sidebar-link" href="teacher-history.html">History</a>
        <a class="sidebar-link" href="buzzer.html">Buzzer</a>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h2>Students</h2>
          <p>Student table and editing tools</p>
        </div>
        <div class="topbar-right">
          <span id="teacherIdentity" class="teacher-identity">Teacher</span>
        </div>
      </header>

      <div class="panel-card">
        <div class="toolbar-row">
          <input id="searchStudent" placeholder="Search by name, nickname, external ID, or internal ID">
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Full Name</th>
                <th>Nickname</th>
                <th>External ID</th>
                <th>Internal ID</th>
                <th>Block 1</th>
                <th>Block 2</th>
                <th>Block 3</th>
                <th>Edit Name</th>
                <th>Edit Nickname</th>
                <th>Edit External ID</th>
                <th>Save</th>
              </tr>
            </thead>
            <tbody id="studentsTableBody">
              <tr>
                <td colspan="11">No students found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="teacher-students.js"></script>
</body>
</html>
