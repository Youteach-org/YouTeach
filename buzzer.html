<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buzzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial;
  margin: 0;
  background: #111;
  color: white;
}

/* HEADER */
.top {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  font-size: 12px;
}

/* MAIN GRID */
.main {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
}

/* BUZZ RESULT */
.result {
  background: #222;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.result h1 {
  font-size: 20px;
  margin: 0;
}

/* CONTROLS */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.controls button {
  flex: 1;
  padding: 10px;
  font-size: 12px;
}

/* SCORES */
.scores {
  background: #222;
  padding: 10px;
  border-radius: 10px;
}

.team {
  margin-bottom: 10px;
  padding: 5px;
  background: #333;
  border-radius: 8px;
}

.team-name {
  font-weight: bold;
}

/* HIDDEN */
.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="top">
  <div id="block">Block 1</div>
  <div id="session">OPEN</div>
</div>

<div class="main">

  <div class="result">
    <h1 id="buzzName">No buzz</h1>
    <div id="group">Group</div>
  </div>

  <div class="controls">
    <button onclick="openBuzz()">Open</button>
    <button onclick="lockBuzz()">Lock</button>
    <button onclick="resetBuzz()">Reset</button>
  </div>

  <div class="scores" id="scores"></div>

</div>

<script src="buzzer.js" type="module"></script>

</body>
</html>
