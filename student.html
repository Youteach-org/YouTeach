<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTeach - Student Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card small-auth-card">
      <h1>YouTeach</h1>
      <h2>Student Login</h2>

      <div class="stack-controls">
        <input id="studentId" placeholder="External ID">
        <input id="studentPassword" type="password" placeholder="Password">
        <button id="studentLoginBtn">Login</button>
        <p id="studentLoginMessage" class="status-text"></p>
      </div>
    </div>
  </div>

  <script type="module" src="student-menu.js"></script>
<script defer src="shared-ui-fixes.js?v=fix-20260508114809"></script>
<script type="module" src="login-enhancements.js"></script>
</body>
</html>
